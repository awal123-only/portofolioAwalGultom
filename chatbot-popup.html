<!-- 
  TEMPEL KODE INI KE PORTOFOLIO KAMU
  Ganti RAILWAY_URL_KAMU dengan URL Railway setelah deploy
-->

<!-- Tombol & Pop-up Chat -->
<button id="chat-btn" onclick="toggleChat()" title="Chat dengan AI">💬 Chat AI</button>

<div id="chat-popup">
  <div id="chat-header">
    🤖 Tanya Awal AI
    <span onclick="toggleChat()" style="cursor:pointer; float:right;">✕</span>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendMsg()"/>
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<style>
  #chat-btn {
    position: fixed; bottom: 30px; right: 30px; z-index: 9999;
    background: #4f46e5; color: white; border: none;
    padding: 12px 20px; border-radius: 30px; font-size: 15px;
    cursor: pointer; box-shadow: 0 4px 15px rgba(79,70,229,0.4);
  }
  #chat-btn:hover { background: #4338ca; }

  #chat-popup {
    display: none; position: fixed; bottom: 90px; right: 30px;
    width: 320px; height: 420px; background: white;
    border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    z-index: 9999; flex-direction: column; overflow: hidden;
  }
  #chat-popup.open { display: flex; }

  #chat-header {
    background: #4f46e5; color: white;
    padding: 14px 16px; font-weight: bold; font-size: 15px;
  }

  #chat-messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    background: #f9f9f9;
  }

  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .msg.user { background: #4f46e5; color: white; align-self: flex-end; border-radius: 12px 12px 4px 12px; }
  .msg.bot { background: white; color: #333; align-self: flex-start; border-radius: 12px 12px 12px 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .msg.typing { color: #aaa; font-style: italic; }

  #chat-input-area {
    display: flex; padding: 10px; gap: 8px; border-top: 1px solid #eee; background: white;
  }
  #chat-input {
    flex: 1; border: 1px solid #ddd; border-radius: 20px;
    padding: 8px 14px; font-size: 14px; outline: none;
  }
  #chat-input-area button {
    background: #4f46e5; color: white; border: none;
    border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 16px;
  }
</style>

<script>
  const BACKEND_URL = "RAILWAY_URL_KAMU"; // Ganti ini!

  function toggleChat() {
    document.getElementById('chat-popup').classList.toggle('open');
  }

  function addMsg(teks, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = teks;
    document.getElementById('chat-messages').appendChild(div);
    document.getElementById('chat-messages').scrollTop = 9999;
    return div;
  }

  async function sendMsg() {
    const input = document.getElementById('chat-input');
    const pesan = input.value.trim();
    if (!pesan) return;
    input.value = '';
    addMsg(pesan, 'user');
    const typing = addMsg('Mengetik...', 'bot typing');

    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pesan })
      });
      const data = await res.json();
      typing.remove();
      addMsg(data.balasan, 'bot');
    } catch {
      typing.remove();
      addMsg('❌ Gagal konek ke server.', 'bot');
    }
  }
</script>
